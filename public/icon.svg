<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pendantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#090b10" />

  <!-- Outer Pendant Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#pendantGrad)" stroke-width="8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="url(#bodyGrad)" stroke="#334155" stroke-width="4" />

  <!-- Core Glowing Sensor Orb -->
  <circle cx="256" cy="256" r="70" fill="url(#pendantGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="45" fill="#ffffff" opacity="0.9" />

  <!-- Acoustic Mic Wave rings -->
  <path d="M 200 170 A 90 90 0 0 1 312 170" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <path d="M 180 140 A 120 120 0 0 1 332 140" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.5" />
</svg>
